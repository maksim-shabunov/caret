name: Feature request
description: Suggest something Caret should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, rather than the solution. What goes wrong today?
    validations: {required: true}

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. If you already have a design, describe it here.
